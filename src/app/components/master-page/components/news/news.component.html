<div id="news" class="news">
  <div class="new" *ngFor="let newObj of news" (click)="openNewDialog(newObj)">
    <h3>{{ newObj.title }}</h3>

    <a target="_blank" href="https://zenit.games/priston"
      ><h6>por: ZENIT GAMES</h6></a
    >
    <div class="new-info">
      <img class="w-100" [src]="newObj.image || 'assets/images/event.jpg'" />

      <h5>
        {{ newObj.summary }}
      </h5>
    </div>
  </div>
</div>
